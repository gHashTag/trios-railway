name: smoke-cycle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3  # Must complete in <60s for smoke
    
    env:
      NEON_DATABASE_URL: postgresql://postgres:password@localhost:5432/test
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build smoke crate
        run: cargo build -p trios-railway-smoke --release

      - name: Run smoke tests
        run: cargo test -p trios-railway-smoke --lib

      - name: Build smoke-agent with smoke feature
        run: cargo build -p trios-igla-race --bin smoke-agent --features smoke --release

      - name: Run smoke-agent pipeline test
        run: |
          set -euo pipefail
          echo "Starting smoke-agent pipeline test..."
          
          # Run smoke-agent and capture output
          cargo run -p trios-igla-race --bin smoke-agent --features smoke \
            --neon-url "mock://skip-db" \
            --worker-id ci-smoke > smoke.jsonl 2>&1 || true
          
          echo "=== SMOKE OUTPUT ==="
          cat smoke.jsonl
          echo "===================="
          
          # Assert that we got at least one step line
          if ! grep -q '"step"' smoke.jsonl; then
            echo "FAIL: No step lines found in output!"
            echo "This is the 'zero steps' bug - trainer exited without JSONL output"
            exit 1
          fi
          
          # Count step lines
          STEPS=$(grep -c '"step"' smoke.jsonl || echo "0")
          echo "✓ Found $STEPS step(s) in output"
          
          if [ "$STEPS" -ge 1 ]; then
            echo "✓✓✓ SMOKE TEST PASSED - pipeline is healthy"
            exit 0
          else
            echo "FAIL: Expected at least 1 step, got $STEPS"
            exit 1
          fi

      - name: Validate JSONL format
        run: |
          # Parse each line as valid JSON
          while IFS= read -r line; do
            if echo "$line" | jq -e '.step' > /dev/null; then
              echo "✓ Valid step: $line"
            fi
          done < smoke.jsonl

      - name: Upload smoke.jsonl artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: smoke.jsonl
          retention-days: 7

  smoke-db-integration:
    # This job runs only if the unit smoke test passes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: smoke-test
    if: success()
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup database
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -d test -c "
            CREATE TABLE IF NOT EXISTS smoke_tests (
              id SERIAL PRIMARY KEY,
              step INTEGER NOT NULL,
              loss FLOAT NOT NULL,
              bpb FLOAT,
              ts TIMESTAMP DEFAULT NOW()
            );
          "

      - name: Run smoke with real DB
        env:
          NEON_DATABASE_URL: postgresql://postgres:password@localhost:5432/test
        run: |
          cargo run -p trios-igla-race --bin smoke-agent --features smoke \
            --neon-url "$NEON_DATABASE_URL" \
            --worker-id ci-integration | tee integration.jsonl
          
          # Verify we got at least one step
          if ! grep -q '"step"' integration.jsonl; then
            echo "FAIL: No steps in integration test"
            exit 1
          fi
          
          STEPS=$(grep -c '"step"' integration.jsonl)
          echo "✓ Integration smoke: $STEPS steps produced"
